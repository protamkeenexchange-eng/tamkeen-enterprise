apiVersion: v1
kind: Namespace
metadata:
  name: tamkeen-platform
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: tamkeen-platform
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: tamkeen/api-gateway:latest
          ports:
            - containerPort: 8080
          env:
            - name: NODE_ENV
              value: "production"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: tamkeen-platform
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: tamkeen/web:latest
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: NEXT_PUBLIC_API_URL
              value: "https://api.local"
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-service
  namespace: tamkeen-platform
spec:
  selector:
    app: api-gateway
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: web-service
  namespace: tamkeen-platform
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: tamkeen-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "tamkeen"
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: tamkeen-platform
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
