apiVersion: apps/v1
kind: Deployment
metadata:
  name: tamkeen-api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: tamkeen/api-gateway:latest
          ports:
            - containerPort: 8080
          env:
            - name: JWT_SECRET
              value: "secret"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tamkeen-transaction-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: transaction-service
  template:
    metadata:
      labels:
        app: transaction-service
    spec:
      containers:
        - name: transaction-service
          image: tamkeen/transaction-service:latest
          ports:
            - containerPort: 3002
          env:
            - name: DATABASE_URL
              value: "postgresql://tamkeen:tamkeen@postgres:5432/tamkeen"
            - name: REDIS_URL
              value: "redis://redis:6379"
            - name: KAFKA_BROKERS
              value: "kafka:9092"