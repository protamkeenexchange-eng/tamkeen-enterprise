name: TAMKEEN Production CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Prisma generate
        run: npx prisma generate

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

  docker-build:
    needs: build-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Gateway image
        run: docker build -t tamkeen/api-gateway:latest ./services/api-gateway

      - name: Build Transaction Service image
        run: docker build -t tamkeen/transaction-service:latest ./services/transaction-service

  deploy:
    needs: docker-build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Kubernetes (placeholder)
        run: |
          echo "Deploying TAMKEEN to Kubernetes cluster..."
          echo "kubectl apply -f infrastructure/k8s/helm"
          echo "Rolling update completed"
