name: TAMKEEN CLOUD DEPLOY

on:
  push:
    branches: ["main"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build API image
        run: |
          docker build -t tamkeen-api ./apps/api

      - name: Tag API image
        run: |
          docker tag tamkeen-api:latest ${{ steps.login-ecr.outputs.registry }}/tamkeen-api:latest

      - name: Push API image
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/tamkeen-api:latest

      - name: Build Web image
        run: |
          docker build -t tamkeen-web ./apps/web

      - name: Tag Web image
        run: |
          docker tag tamkeen-web:latest ${{ steps.login-ecr.outputs.registry }}/tamkeen-web:latest

      - name: Push Web image
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/tamkeen-web:latest

      - name: Deploy placeholder
        run: echo "ECS deployment step ready (add task definition next)"